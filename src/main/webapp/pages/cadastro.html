<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <link rel="stylesheet" href="../css/cadastro.css"/>
        <title>Cadastro de Perfil</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <div class="pagina">

            <!-- MENU LATERAL -->
            <aside class="menu">
                <div class="perfil">
                    <div id="fotoPerfil" class="fotoPerfil"></div>
                    <ul class="perfilCartao">
                        <li id="nomeUsuario"></li>
                        <li id="cargoUsuario"></li>
                        <li>
                            <button id="btnLogout" class="botaoLogout">Sair</button>
                        </li>
                    </ul>
                </div>

                <ul class="listaMenu">
                    <li><a href="dashboard.html">Dashboard</a></li>
                    <li><a href="estoqueBaixo.html">Produtos Para Repor</a></li>
                    <li><a href="cadastroProdutos.html">Cadastrar Produto</a></li>
                    <li><a href="cadastro.html">Cadastrar Perfil</a></li>
                </ul>
            </aside>

            <main class="conteudo">
                <h1 class="tituloPagina">Cadastro de Perfil</h1>

                <form action="../cadastro" method="POST">
                    <div class="container">
                        <div class="dadosPessoais">
                            <h2 class="tituloSecao">Dados pessoais</h2>

                            <label for="nameFirst">Nome</label>
                            <input type="text" name="nameFirst" id="nameFirst" placeholder="Digite o seu nome" />

                            <label for="sobrenome">Sobrenome</label>
                            <input type="text" name="sobrenome" id="sobrenome" placeholder="Digite o seu sobrenome" />

                            <label for="matricula">Matricula</label>
                            <input type="text" name="matricula" id="matricula" placeholder="Digite a sua matricula" />

                            <label for="cpf">CPF</label>
                            <input type="text" name="cpf" id="cpf" placeholder="Digite o seu CPF" />

                            <label for="sexo">Sexo</label>
                            <select name="sexo" id="sexo">
                                <option value="">Selecione o sexo</option>
                                <option value="1">Masculino</option>
                                <option value="2">Feminino</option>
                            </select>

                            <label for="dtaNascimento">Data de nascimento</label>
                            <input type="date" name="dtaNascimento" id="dtaNascimento" />

                            <label for="email">E-mail</label>
                            <input type="email" name="email" id="email" placeholder="xxxxxxxx@xxxx.xxx.xx" />

                            <label for="telefone">Telefone</label>
                            <input type="tel" name="telefone" id="telefone" placeholder="(00)0 0000-0000" />

                            <label for="usuario">Usuário</label>
                            <input type="text" name="usuario" id="usuario" placeholder="Digite o usuário" />

                            <label for="senha">Senha</label>
                            <input type="password" name="senha" id="senha" placeholder="Digite a senha" />

                            <label for="funcao">Função</label>
                            <input type="text" name="funcao" id="funcao" placeholder="Digite a sua função" />
                        </div>

                        <div class="conteinerEndereco">
                            <h2 class="tituloSecao">Endereço</h2>

                            <label for="cep">CEP</label>
                            <input type="text" name="cep" id="cep" />

                            <label for="endereco">Endereço</label>
                            <input type="text" name="endereco" id="endereco" />

                            <label for="numero">Número</label>
                            <input type="text" name="numero" id="numero" />

                            <label for="bairro">Bairro</label>
                            <input type="text" name="bairro" id="bairro" />

                            <label for="cidade">Cidade</label>
                            <input type="text" name="cidade" id="cidade" />

                            <label for="estado">Estado</label>
                            <input type="text" name="estado" id="estado" />

                            <label for="complemento">Complemento</label>
                            <input type="text" name="complemento" id="complemento" />

                            <div class="btn">
                                <a href="dashboard.html" class="btnCancelar">Cancelar</a>
                                <button type="submit" class="btnCadastrar">Cadastrar</button>
                            </div>
                        </div>
                    </div>
                </form>
            </main>

        </div>
        <script src="../js/cep.js"></script>
        <script src="../js/logout.js"></script>
        <script src="../js/validarLogin.js"></script>
    </body>
</html>
