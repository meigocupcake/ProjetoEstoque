<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <link rel="stylesheet" href="../css/cadastroProdutos.css"/>
        <title>Cadastrando Produto</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <div class="pagina">

            <aside class="menu">
                <div class="perfil">
                    <div id="fotoPerfil" class="fotoPerfil"></div>
                    <ul class="perfilCartao">
                        <li id="nomeUsuario"></li>
                        <li id="cargoUsuario"></li>
                        <li>
                            <button id="btnLogout" class="botaoLogout">Sair</button>
                        </li>
                    </ul>
                </div>

                <ul class="listaMenu">
                    <li><a href="dashboard.html">Dashboard</a></li>
                    <li><a href="estoqueBaixo.html">Produtos Para Repor</a></li>
                    <li><a href="cadastroProdutos.html">Cadastrar Produto</a></li>
                    <li><a href="cadastro.html">Cadastrar Perfil</a></li>
                </ul>
            </aside>

            <main class="conteudo">
                <h1 class="tituloPagina">Cadastro de Produto</h1>

                <section id="form-container">
                    <form id="formCadastroProduto">
                        <div class="grupo-form">
                            <label>Código de Barras</label>
                            <input type="text" name="codigoBarras" inputmode="numeric" pattern="[0-9]+" title="Apenas números" required />
                        </div>
                        <div class="grupo-form">
                            <label>Nome do produto</label>
                            <input type="text" name="nomeProduto" required />
                        </div>

                        <div class="linha-form">
                            <div class="grupo-form">
                                <label>Local de Armazenamento</label>
                                <input type="text" name="localArmazenamento" required />
                            </div>
                            <div class="grupo-form">
                                <label>Status:</label>
                                <select name="status" required>
                                    <option value="" disabled selected hidden>Selecione o status</option>
                                    <option value="Ativo">Ativo</option>
                                    <option value="Inativo">Inativo</option>
                                </select>
                            </div>
                        </div>
                        <div class="linha-form">
                            <div class="grupo-form">
                                <label>Fabricante</label>
                                <input type="text" name="fabricante" required />
                            </div>
                            <div class="grupo-form">
                                <label>Marca</label>
                                <input type="text" name="marca" required />
                            </div>
                        </div>

                        <div class="linha-form">
                            <div class="grupo-form">
                                <label>Data de Fabricação</label>
                                <input type="date" name="dataFabricacao" required />
                            </div>
                            <div class="grupo-form">
                                <label>Data de Vencimento</label>
                                <input type="date" name="dataVencimento" required />
                            </div>
                        </div>

                        <div class="linha-form">
                            <div class="grupo-form">
                                <label>Valor Unitário</label>
                                <input type="number" name="valor" id="valorUnitario" min="0" step="0.01" required />
                            </div>
                            <div class="grupo-form">
                                <label>Quantidade mínima de estoque</label>
                                <input type="number" name="estoqueMinimo" id="estoqueMinimo" min="1" required />
                            </div>
                        </div>
                        <div class="acoes-form">
                            <a href="dashboard.html" class="btn-cancelar">Cancelar</a>
                            <button type="submit" class="btn-salvar">Salvar</button>
                        </div>
                    </form>
                </section>
            </main>

        </div>
        <script src="../js/cadastroProdutos.js" defer></script>
        <script src="../js/logout.js"></script>
        <script src="../js/validarLogin.js"></script>
    </body>
</html>
