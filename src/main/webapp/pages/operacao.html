<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../css/operacoes.css" />
</head>
<body>
    <div class="opcoes">
        <label>
            <input type="radio" name="tipo" value="entrada">
            Entrada
        </label>

        <label>
            <input type="radio" name="tipo" value="saida">
            Saída
        </label>
    </div>
    <div class="busca">
        <input type="search" placeholder="Pesquisar produtos...">
    </div>
    <div>
        <label for="quantidade">Quantidade:</label>
        <input
                type="number"
                id="quantidade"
                name="quantidade"
                min="1"
                placeholder="Digite a quantidade"
                required
        >
    </div>
    <div>
        <button id="btnSalvar" class="botao">
            Realizar operação
        </button>
    </div>
</body>
</html>
